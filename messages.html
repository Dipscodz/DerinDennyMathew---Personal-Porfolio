<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry Messages | Derin Denny Mathew</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .messages-container {
            max-width: 800px;
            margin: 100px auto 2rem;
            padding: 0 2rem;
        }

        .message-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .message-card:hover {
            border-color: var(--accent-primary);
        }

        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .sender {
            font-weight: 600;
            color: var(--accent-primary);
        }

        .subject {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
        }

        .body {
            color: var(--text-secondary);
            white-space: pre-wrap;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 3rem;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Derin<span class="accent">.</span></a>
            <div class="nav-links">
                <a href="index.html">Back to Portfolio</a>
            </div>
        </div>
    </nav>

    <div class="messages-container">
        <div class="actions">
            <h1>Inquiry Messages</h1>
            <button id="clear-messages" class="btn btn-secondary btn-sm"><i class="fas fa-trash"></i> Clear All</button>
        </div>
        <div id="messages-list">
            <!-- Messages will be loaded here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const messagesList = document.getElementById('messages-list');
            const clearBtn = document.getElementById('clear-messages');

            function loadMessages() {
                const messages = JSON.parse(localStorage.getItem('contactMessages')) || [];

                if (messages.length === 0) {
                    messagesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox fa-3x" style="margin-bottom: 1rem; opacity: 0.5;"></i>
                            <p>No messages found.</p>
                        </div>
                    `;
                    return;
                }

                messagesList.innerHTML = messages.map(msg => `
                    <div class="message-card">
                        <div class="meta">
                            <span class="sender">${msg.name} (${msg.email})</span>
                            <span class="date">${msg.date}</span>
                        </div>
                        <div class="subject">${msg.subject}</div>
                        <div class="body">${msg.message}</div>
                    </div>
                `).join('');
            }

            clearBtn.addEventListener('click', () => {
                if (confirm('Are you sure you want to delete all messages?')) {
                    localStorage.removeItem('contactMessages');
                    loadMessages();
                }
            });

            loadMessages();
        });
    </script>
</body>

</html>
